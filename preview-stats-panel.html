<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>她的星群 · 数据统计浮层预览</title>
<style>
  :root {
    --bg-deep: #070B14;
    --gold: #F2C14E;
    --gold-soft: #F7D98A;
    --violet: #B79CFF;
    --violet-soft: #D6C7FF;
    --text: #EDEFF5;
    --muted: #9AA3B2;
    --border: rgba(255,255,255,0.1);
    --t-education: #4ECDC4;
    --t-suffrage: #A8E6CF;
    --t-body: #FF6B9D;
    --t-labor: #F7B32B;
    --t-science: #6C5CE7;
    --t-art: #FD79A8;
    --t-peace: #00B894;
    --r-asia: #F2C14E;
    --r-europe: #B79CFF;
    --r-africa: #FD79A8;
    --r-americas: #4ECDC4;
    --r-oceania: #A8E6CF;
    --r-other: #9AA3B2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: "Noto Sans SC","Inter",-apple-system,sans-serif;
    font-weight: 400; font-size: 15px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .serif { font-family: "Noto Serif SC","Fraunces",Georgia,serif; }

  /* ---------- 星空背景 ---------- */
  .starfield {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(183,156,255,0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(242,193,78,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(183,156,255,0.06) 0%, transparent 60%),
      var(--bg-deep);
  }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #FFF6E0; opacity: 0.6;
    animation: breathe 3s ease-in-out infinite;
  }
  .star.gold { background: var(--gold-soft); box-shadow: 0 0 6px var(--gold); }
  .star.big { width: 4px; height: 4px; box-shadow: 0 0 12px rgba(255,246,224,0.8); }
  @keyframes breathe {
    0%,100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  /* ---------- 地球位（占位：一个发光球）---------- */
  .globe-wrap {
    position: fixed; inset: 0; z-index: 1; display: flex;
    align-items: center; justify-content: center; pointer-events: none;
  }
  .globe {
    width: 520px; height: 520px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,246,224,0.18) 0%, transparent 35%),
      radial-gradient(circle at 70% 75%, rgba(104,180,255,0.12) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #1a2340 0%, #0b1228 45%, #060a14 72%);
    box-shadow:
      inset 0 0 80px rgba(0,0,0,0.7),
      0 0 90px rgba(78,205,196,0.08),
      0 0 160px rgba(183,156,255,0.05);
    position: relative;
  }
  .globe::before {
    content:""; position:absolute; inset:-40px; border-radius:50%;
    border: 1px solid rgba(242,193,78,0.15);
  }
  /* 光点点缀 */
  .dot {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
  }
  .dot.d2 { background: var(--violet); box-shadow: 0 0 10px var(--violet), 0 0 22px var(--violet); }
  .dot.d3 { background: var(--t-education); box-shadow: 0 0 10px var(--t-education), 0 0 22px var(--t-education); }

  /* ---------- 中心引导文案 ---------- */
  .center-tip {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, calc(-50% + 330px));
    text-align: center; z-index: 5; pointer-events: none;
  }
  .center-tip .kicker {
    font-size: 11px; letter-spacing: 0.3em; color: rgba(242,193,78,0.7);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .center-tip .hint { color: var(--muted); font-size: 13px; }
  .center-tip .hint em { color: var(--gold-soft); font-style: normal; border-bottom: 1px dashed rgba(242,193,78,0.5); padding-bottom: 1px; }

  /* ============================================================
     左下角数据入口按钮
     ============================================================ */
  .stats-trigger {
    position: fixed; bottom: 24px; left: 24px; z-index: 40;
    font-family: inherit; border: none; background: none; padding: 0; cursor: pointer;
    color: rgba(255,255,255,0.60); transition: color .2s ease;
    font-size: 13px; font-weight: 300; letter-spacing: 0.05em;
  }
  .stats-trigger:hover { color: rgba(255,255,255,0.92); }
  .stats-trigger .pill {
    display: inline-block; padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,0.20);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.05);
    transition: all .2s ease;
  }
  .stats-trigger:hover .pill {
    background: rgba(0,0,0,0.4);
    border-color: rgba(255,255,255,0.20);
    box-shadow: 0 0 24px rgba(242,193,78,0.12);
  }
  /* Tooltip */
  .stats-trigger .tooltip-wrap { position: relative; display: inline-block; }
  .stats-trigger .tooltip {
    pointer-events: none; position: absolute; left: 50%; bottom: 100%;
    transform: translateX(-50%) translateY(4px);
    padding: 4px 10px; margin-bottom: 10px;
    border-radius: 6px; white-space: nowrap;
    font-size: 11px; letter-spacing: 0; font-weight: 400;
    background: rgba(0,0,0,0.80); color: rgba(255,255,255,0.82);
    border: 1px solid rgba(255,255,255,0.10);
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  .stats-trigger:hover .tooltip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .stats-trigger .tooltip::after {
    content: ""; position: absolute; left: 50%; bottom: -4px;
    width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg);
    background: rgba(0,0,0,0.80);
    border-right: 1px solid rgba(255,255,255,0.10);
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }

  /* ============================================================
     Dialog 遮罩 + 弹窗
     ============================================================ */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.70);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .panel {
    position: fixed; left: 50%; top: 50%; z-index: 51;
    transform: translate(-50%, -50%) scale(0.96);
    width: min(92vw, 540px); max-height: 86vh; overflow-y: auto;
    padding: 0;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(7,11,20,0.60);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 80px rgba(183,156,255,0.08);
    color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  body.stats-open .overlay { opacity: 1; pointer-events: auto; }
  body.stats-open .panel { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

  /* panel 顶部星座装饰 */
  .panel-halo {
    position: absolute; top: 0; left: 0; right: 0; height: 96px;
    border-radius: 16px 16px 0 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(242,193,78,0.20) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(183,156,255,0.22) 0%, transparent 55%);
  }
  .panel-halo svg { position: absolute; top: 0; left: 0; width: 100%; height: 80px; opacity: 0.80; }

  /* panel 内边距 */
  .panel-head { position: relative; padding: 24px 28px 12px; display: flex; align-items: flex-start; justify-content: space-between; }
  .panel-head .kicker {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    color: rgba(242,193,78,0.82);
  }
  .panel-head h2 {
    margin-top: 6px; font-size: 22px; line-height: 1.25;
    color: rgba(237,239,245,0.96);
  }
  .panel-head .sub { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .panel-head .sub b { color: var(--gold); font-weight: 500; }
  .close-x {
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; height: 30px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .close-x:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .panel-body { position: relative; padding: 0 28px 28px; display: flex; flex-direction: column; gap: 24px; }

  /* section 标题 */
  .sec-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sec-title .icon {
    width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
  }
  .sec-title h3 { font-size: 16px; color: rgba(237,239,245,0.95); }
  .sec-title .hint { margin-left: auto; font-size: 11px; color: var(--muted); }

  .icon-bar { background: rgba(242,193,78,0.10); color: var(--gold); }
  .icon-clock { background: rgba(183,156,255,0.14); color: var(--violet-soft); }
  .icon-globe { background: rgba(78,205,196,0.14); color: var(--t-education); }

  /* ============================================================
     （1）议题分布 · 水平堆叠条
     ============================================================ */
  .theme-rows { display: flex; flex-direction: column; gap: 10px; }
  .theme-row { display: flex; align-items: center; gap: 12px; }
  .theme-bar {
    position: relative; flex: 1; height: 12px; border-radius: 999px;
    background: rgba(255,255,255,0.05); overflow: hidden;
  }
  .theme-fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .7s cubic-bezier(.16,1,.3,1);
  }
  .theme-meta {
    width: 130px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
  }
  .theme-meta .name { font-weight: 500; }
  .theme-meta .num { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ============================================================
     （2）时代跨度 · 时间轴散点
     ============================================================ */
  .era-card {
    border-radius: 12px; padding: 20px 16px 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .era-svg {
    position: relative; width: 100%; height: 130px;
  }
  .era-svg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .era-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .person-span {
    position: absolute; height: 2px; border-radius: 999px; transform-origin: left center;
    transform: scaleX(0); opacity: 0;
    transition: transform .8s cubic-bezier(.16,1,.3,1) .1s, opacity .8s ease .1s;
  }
  body.stats-open .person-span { transform: scaleX(1); opacity: 1; }
  .person-dot {
    position: absolute; width: 12px; height: 12px; border-radius: 50%;
    transform: translate(-50%, calc(-50% - 1px)) scale(0);
    transition: transform .45s cubic-bezier(.16,1,.3,1);
    display: inline-flex; align-items: center; justify-content: center;
  }
  body.stats-open .person-dot { transform: translate(-50%, calc(-50% - 1px)) scale(1); }
  .person-label {
    position: absolute; transform: translate(-50%, -100%);
    margin-top: -14px; font-size: 10px; white-space: nowrap;
    color: transparent; transition: color .2s ease;
  }
  .person-line:hover .person-label { color: inherit; }
  .era-ticks { position: relative; height: 20px; margin-top: 4px; }
  .era-ticks span {
    position: absolute; transform: translateX(-50%);
    font-size: 10px; color: rgba(154,163,178,0.72); font-variant-numeric: tabular-nums;
  }
  .era-legend {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05);
    display: flex; flex-wrap: wrap; gap: 16px 16px; font-size: 11px; color: var(--muted);
  }
  .era-legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .era-legend .chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }

  /* ============================================================
     （3）地域覆盖 · 条形 + 标签云
     ============================================================ */
  .region-card {
    border-radius: 12px; padding: 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .region-rows { display: flex; flex-direction: column; gap: 10px; }
  .region-row { display: flex; align-items: center; gap: 12px; }
  .region-bar { position: relative; flex: 1; height: 12px; border-radius: 999px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .region-fill {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 999px;
    transition: width .7s cubic-bezier(.16,1,.3,1);
  }
  .region-meta {
    width: 100px; display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
  }
  .region-meta .name { font-weight: 500; }
  .region-meta .num { color: var(--muted); font-variant-numeric: tabular-nums; }

  .tag-cloud {
    margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid; font-size: 12px; line-height: 1;
    transition: transform .15s ease;
  }
  .tag:hover { transform: scale(1.03); }
  .tag .dot { width: 6px; height: 6px; border-radius: 50%; }
  .tag .count {
    margin-left: 2px; padding: 2px 6px; border-radius: 999px;
    font-size: 10px; font-variant-numeric: tabular-nums;
  }

  /* 底部脚注 */
  .foot {
    padding-top: 4px; display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: rgba(154,163,178,0.80);
  }
  .foot .stars { letter-spacing: 0.6em; color: rgba(242,193,78,0.7); }

  /* 滚动条美化 */
  .panel::-webkit-scrollbar { width: 6px; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .panel::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 520px) {
    .theme-meta { width: 108px; }
    .region-meta { width: 90px; }
  }
</style>
</head>
<body>

<!-- 星空背景 -->
<div class="starfield" id="starfield"></div>

<!-- 地球占位 -->
<div class="globe-wrap">
  <div class="globe">
    <span class="dot" style="top:42%; left:48%"></span>
    <span class="dot d2" style="top:36%; left:62%"></span>
    <span class="dot d3" style="top:52%; left:36%"></span>
    <span class="dot d2" style="top:60%; left:56%; opacity:.8"></span>
    <span class="dot" style="top:30%; left:40%; opacity:.7"></span>
  </div>
</div>

<!-- 中心引导 -->
<div class="center-tip">
  <div class="kicker serif">✦  Constellation of She</div>
  <div class="hint">拖动地球，点击光点，遇见一位女性<br/>或看看<em>左下角</em>的「星辰全景」统计。</div>
</div>

<!-- 左下角触发按钮 -->
<button type="button" id="statsBtn" class="stats-trigger" aria-label="数据统计">
  <span class="tooltip-wrap">
    <span class="pill">✦ 已收录 <b id="totalNum" style="color:inherit;font-weight:inherit">3</b> 位星辰</span>
    <span class="tooltip">点击查看数据统计</span>
  </span>
</button>

<!-- Dialog 遮罩 -->
<div class="overlay" id="overlay"></div>

<!-- Dialog 内容 -->
<aside class="panel" role="dialog" aria-modal="true" aria-labelledby="stats-title">
  <div class="panel-halo" aria-hidden="true">
    <svg viewBox="0 0 540 80" preserveAspectRatio="none">
      <defs>
        <linearGradient id="constGrad" x1="0" x2="1">
          <stop offset="0%"  stop-color="#F2C14E" stop-opacity="0.00"/>
          <stop offset="30%" stop-color="#F2C14E" stop-opacity="0.55"/>
          <stop offset="60%" stop-color="#B79CFF" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#B79CFF" stop-opacity="0.00"/>
        </linearGradient>
      </defs>
      <polyline fill="none" stroke="url(#constGrad)" stroke-width="1"
                points="20,36 110,18 180,46 260,22 330,52 420,20 510,42"/>
      <g fill="#F2C14E">
        <circle cx="20" cy="36" r="1.5" opacity="0.9"/>
        <circle cx="110" cy="18" r="2.2" />
        <circle cx="180" cy="46" r="1.8" opacity="0.85"/>
        <circle cx="260" cy="22" r="2.4" />
        <circle cx="330" cy="52" r="1.6" opacity="0.9"/>
        <circle cx="420" cy="20" r="2.1" />
        <circle cx="510" cy="42" r="1.5" opacity="0.9"/>
      </g>
    </svg>
  </div>

  <div class="panel-head">
    <div>
      <div class="kicker">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.8L18 9l-4.2 1.2L12 15l-1.8-4.8L6 9l4.2-1.2L12 3z"/><path d="M19 14l.9 2.4L22 17l-2.1.6L19 20l-.9-2.4L16 17l2.1-.6L19 14z"/></svg>
        CONSTELLATION DATA
      </div>
      <h2 id="stats-title" class="serif">星群全景 · 数据统计</h2>
      <div class="sub">基于当前已收录的 <b id="totalNum2">3</b> 位女性故事</div>
    </div>
    <button type="button" class="close-x" id="closeX" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="panel-body">
    <!-- （1）议题分布 -->
    <section>
      <div class="sec-title">
        <span class="icon icon-bar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="4" width="3" height="14"/></svg>
        </span>
        <h3 class="serif">议题分布</h3>
        <span class="hint">按出现次数排序</span>
      </div>
      <div class="theme-rows" id="themeRows"></div>
    </section>

    <!-- （2）时代跨度 -->
    <section>
      <div class="sec-title">
        <span class="icon icon-clock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        </span>
        <h3 class="serif">时代跨度</h3>
        <span class="hint">每个人物对应一段生命区间</span>
      </div>
      <div class="era-card">
        <div class="era-svg" id="eraBox">
          <!-- 刻度线 + 主轴线 -->
          <svg id="eraAxes" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <!-- 人物线段/点层 -->
          <div class="era-layer" id="eraPeople"></div>
        </div>
        <div class="era-ticks" id="eraTicks"></div>
        <div class="era-legend" id="eraLegend"></div>
      </div>
    </section>

    <!-- （3）地域覆盖 -->
    <section>
      <div class="sec-title">
        <span class="icon icon-globe">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        </span>
        <h3 class="serif">地域覆盖</h3>
        <span class="hint">归一化至大洲级别</span>
      </div>
      <div class="region-card">
        <div class="region-rows" id="regionRows"></div>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>
    </section>

    <!-- 底部脚注 -->
    <div class="foot">
      <span>数据来源：stories.json · 7 个议题</span>
      <span class="stars">✦ ✦ ✦</span>
    </div>
  </div>
</aside>

<script>
/* ===================== 数据 ===================== */
const THEMES = {
  education:     { zh: "教育权",       color: "#4ECDC4" },
  suffrage:      { zh: "参政与投票",   color: "#A8E6CF" },
  body:          { zh: "身体自主",     color: "#FF6B9D" },
  labor:         { zh: "劳动权益",     color: "#F7B32B" },
  science:       { zh: "科学参与",     color: "#6C5CE7" },
  art_voice:     { zh: "艺术与发声",   color: "#FD79A8" },
  peace_justice: { zh: "和平与正义",   color: "#00B894" },
};

const PEOPLE = [
  {
    id: "savitribai_phule",
    name_zh: "萨维特里巴伊·菲勒",
    birth_year: 1831, death_year: 1897,
    region_zh: "印度 · 马哈拉施特拉邦",
    region_en: "Maharashtra, India",
    themes: ["education", "suffrage"],
  },
  {
    id: "qiu_jin",
    name_zh: "秋瑾",
    birth_year: 1875, death_year: 1907,
    region_zh: "中国 · 浙江绍兴",
    region_en: "Shaoxing, Zhejiang, China",
    themes: ["suffrage", "art_voice", "education"],
  },
  {
    id: "hipatia",
    name_zh: "希帕蒂亚",
    birth_year: 355, death_year: 415,
    region_zh: "埃及 · 亚历山大港",
    region_en: "Alexandria, Egypt",
    themes: ["science", "education"],
  },
];

/* ===================== 通用工具 ===================== */
const total = PEOPLE.length;
document.getElementById("totalNum").textContent = total;
document.getElementById("totalNum2").textContent = total;

function hexA(hex, a){
  const m=/^#([0-9a-f]{6})$/i.exec(hex);
  if(!m) return hex;
  const n=parseInt(m[1],16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ===================== 星点背景生成 ===================== */
(function(){
  const sf = document.getElementById("starfield");
  const N = 120;
  for (let i=0;i<N;i++){
    const s = document.createElement("span");
    s.className = "star" + (Math.random()<0.05? " big" : (Math.random()<0.18? " gold" : ""));
    s.style.left = (Math.random()*100).toFixed(2)+"%";
    s.style.top = (Math.random()*100).toFixed(2)+"%";
    s.style.animationDelay = (Math.random()*3).toFixed(2)+"s";
    s.style.animationDuration = (2 + Math.random()*3).toFixed(2)+"s";
    sf.appendChild(s);
  }
})();

/* ============================================================
   （1）议题分布
   ============================================================ */
(function(){
  const counts = new Map();
  PEOPLE.forEach(p=>p.themes.forEach(t=>counts.set(t,(counts.get(t)||0)+1)));
  const rows = Object.keys(THEMES)
    .map(k => ({ key:k, count: counts.get(k)||0 }))
    .sort((a,b)=>b.count-a.count);
  const max = Math.max(1, ...rows.map(r=>r.count));

  const host = document.getElementById("themeRows");
  host.innerHTML = "";
  rows.forEach(r => {
    const pct = (r.count/max)*100;
    const color = THEMES[r.key].color;
    const el = document.createElement("div");
    el.className = "theme-row";
    el.innerHTML = `
      <div class="theme-bar">
        <div class="theme-fill" data-pct="${pct}"
             style="background: linear-gradient(90deg, ${hexA(color,0.6)}, ${hexA(color,0.88)});
                    box-shadow: 0 0 12px ${hexA(color,0.35)};"></div>
      </div>
      <div class="theme-meta">
        <span class="name" style="color:${color}">${THEMES[r.key].zh}</span>
        <span class="num">${r.count}</span>
      </div>
    `;
    host.appendChild(el);
  });
  // 在打开时触发动画
  function animate(){
    host.querySelectorAll(".theme-fill").forEach(f=>{
      f.style.width = f.getAttribute("data-pct") + "%";
    });
  }
  // 首帧：立即设置，避免首屏未动
  document.addEventListener("DOMContentLoaded", ()=>setTimeout(animate, 50));
  window.__statsOpenHooks = window.__statsOpenHooks || [];
  window.__statsOpenHooks.push(animate);
})();

/* ============================================================
   （2）时代跨度
   ============================================================ */
(function(){
  const samples = PEOPLE.filter(p=>typeof p.birth_year === "number").map(p=>({
    id: p.id, name_zh: p.name_zh,
    birth: p.birth_year,
    death: typeof p.death_year === "number" ? p.death_year : p.birth_year + 40,
  }));
  const births = samples.map(s=>s.birth), deaths = samples.map(s=>s.death);
  const min = Math.min(0, Math.floor(Math.min(...births,...deaths)/100)*100 - 100);
  const max = Math.max(2000, Math.ceil(Math.max(...births,...deaths)/100)*100 + 100);

  function eraColor(birthYear){
    if (birthYear < 500)   return { label:"古典 (0–500)",       color:"#F2C14E" };
    if (birthYear < 1500)  return { label:"中世纪 (500–1500)",  color:"#B79CFF" };
    if (birthYear < 1800)  return { label:"近代 (1500–1800)",   color:"#FD79A8" };
    if (birthYear < 1900)  return { label:"近现代 (1800–1900)", color:"#A8E6CF" };
    return { label:"20 世纪后", color:"#F7B32B" };
  }

  // 刻度线
  const step = 500;
  const ticks = [];
  for (let v=min; v<=max; v+=step) ticks.push(v);
  if (ticks[ticks.length-1] !== max) ticks.push(max);

  const axesSvg = document.getElementById("eraAxes");
  let axisLines = "";
  ticks.forEach(t => {
    const x = ((t-min)/(max-min))*100;
    const isMajor = t%1000 === 0;
    const y1 = isMajor ? 5 : 25, y2 = 85;
    const stroke = isMajor ? hexA("#F2C14E",0.22) : "rgba(255,255,255,0.06)";
    const dash = isMajor ? "" : "stroke-dasharray='0.4,0.6'";
    axisLines += `<line x1='${x}' x2='${x}' y1='${y1}' y2='${y2}' stroke='${stroke}' stroke-width='0.3' ${dash}/>`;
  });
  axesSvg.innerHTML = `
    <defs>
      <linearGradient id="axisGrad" x1="0" x2="1">
        <stop offset="0%" stop-color="#F2C14E" stop-opacity="0.1"/>
        <stop offset="50%" stop-color="#B79CFF" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#F2C14E" stop-opacity="0.1"/>
      </linearGradient>
    </defs>
    ${axisLines}
    <line x1="0" x2="100" y1="85" y2="85" stroke="url(#axisGrad)" stroke-width="0.6"/>
  `;

  // 人物线段/点
  const peopleLayer = document.getElementById("eraPeople");
  peopleLayer.innerHTML = "";
  samples.forEach((s,i)=>{
    const left = ((s.birth-min)/(max-min))*100;
    const right = ((s.death-min)/(max-min))*100;
    const lane = i%3;
    const top = 18 + lane*20; // px
    const era = eraColor(s.birth);

    const line = document.createElement("div");
    line.className = "person-line";
    line.style.position = "absolute";
    line.style.left = left + "%";
    line.style.top = top + "px";
    line.style.width = (right-left) + "%";

    const span = document.createElement("div");
    span.className = "person-span";
    span.style.background = `linear-gradient(90deg, ${hexA(era.color,0.18)}, ${hexA(era.color,0.85)}, ${hexA(era.color,0.18)})`;
    span.style.boxShadow = `0 0 6px ${hexA(era.color,0.5)}`;

    const dot = document.createElement("span");
    dot.className = "person-dot";
    dot.style.left = "0%";
    dot.style.background = `radial-gradient(circle at 30% 30%, #FFF6D6, ${era.color} 65%)`;
    dot.style.boxShadow = `0 0 10px ${hexA(era.color,0.9)}, 0 0 22px ${hexA(era.color,0.5)}`;
    dot.title = `${s.name_zh} · ${s.birth}–${s.death}`;

    const label = document.createElement("div");
    label.className = "person-label";
    label.style.left = "0%";
    label.style.color = era.color;
    label.textContent = s.name_zh;

    line.appendChild(span);
    line.appendChild(dot);
    line.appendChild(label);
    peopleLayer.appendChild(line);
  });

  // 底部刻度文字
  const ticksHost = document.getElementById("eraTicks");
  ticksHost.innerHTML = "";
  ticks.forEach(t => {
    const left = ((t-min)/(max-min))*100;
    const s = document.createElement("span");
    s.style.left = left + "%";
    s.textContent = t<0 ? `前${-t}` : t;
    ticksHost.appendChild(s);
  });

  // 图例（按实际出现的年代）
  const legendSet = new Set();
  samples.forEach(s=>legendSet.add(eraColor(s.birth).label));
  const legendOrder = [
    ["#F2C14E","古典 (0–500)"],
    ["#B79CFF","中世纪 (500–1500)"],
    ["#FD79A8","近代 (1500–1800)"],
    ["#A8E6CF","近现代 (1800–1900)"],
    ["#F7B32B","20 世纪后"],
  ];
  const legend = document.getElementById("eraLegend");
  legend.innerHTML = "";
  legendOrder.forEach(([c,l])=>{
    if (!legendSet.has(l)) return;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<i style="background:${c};box-shadow:0 0 6px ${hexA(c,0.7)}"></i>${l}`;
    legend.appendChild(chip);
  });
})();

/* ============================================================
   （3）地域覆盖
   ============================================================ */
(function(){
  const RULES = [
    { key:"asia",     label:"亚洲",   color:"#F2C14E", hint:["中国","日本","韩国","印度","伊朗","越南","泰国","印尼","菲律宾","中亚","西亚","Asia","India","China","Japan","Korea","Iran"] },
    { key:"europe",   label:"欧洲",   color:"#B79CFF", hint:["英国","法国","德国","意大利","西班牙","葡萄牙","波兰","俄国","瑞典","挪威","希腊","欧洲","Europe","UK","England","France","Germany","Italy","Spain","Russia"] },
    { key:"africa",   label:"非洲",   color:"#FD79A8", hint:["埃及","南非","尼日利亚","肯尼亚","埃塞俄比亚","非洲","Africa","Egypt","Alexandria"] },
    { key:"americas", label:"美洲",   color:"#4ECDC4", hint:["美国","加拿大","墨西哥","巴西","阿根廷","智利","美洲","America","USA","Brazil","Canada","Mexico"] },
    { key:"oceania",  label:"大洋洲", color:"#A8E6CF", hint:["澳大利亚","新西兰","大洋洲","Australia","New Zealand","Oceania"] },
  ];
  function norm(p){
    const h = `${p.region_zh} ${p.region_en}`;
    for (const r of RULES) if (r.hint.some(x=>h.includes(x))) return r.key;
    return "other";
  }
  const meta = { ...Object.fromEntries(RULES.map(r=>[r.key,{label:r.label,color:r.color}])), other:{label:"其他",color:"#9AA3B2"} };

  const counts = new Map();
  PEOPLE.forEach(p=>{
    const k = norm(p);
    counts.set(k, (counts.get(k)||0)+1);
  });
  const rows = [...counts.entries()]
    .map(([k,v])=>({ key:k, count:v, label:meta[k].label, color:meta[k].color }))
    .sort((a,b)=>b.count-a.count);
  const max = Math.max(1, ...rows.map(r=>r.count));

  const rowsHost = document.getElementById("regionRows");
  rowsHost.innerHTML = "";
  rows.forEach(r=>{
    const pct = (r.count/max)*100;
    const el = document.createElement("div");
    el.className = "region-row";
    el.innerHTML = `
      <div class="region-bar">
        <div class="region-fill" data-pct="${pct}"
             style="background: linear-gradient(90deg, ${hexA(r.color,0.55)}, ${hexA(r.color,0.95)});
                    box-shadow: 0 0 10px ${hexA(r.color,0.4)};"></div>
      </div>
      <div class="region-meta">
        <span class="name" style="color:${r.color}">${r.label}</span>
        <span class="num">${r.count} 位</span>
      </div>
    `;
    rowsHost.appendChild(el);
  });

  const cloud = document.getElementById("tagCloud");
  cloud.innerHTML = "";
  rows.forEach(r=>{
    const scale = 0.85 + (r.count/max)*0.5;
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.borderColor = hexA(r.color,0.4);
    tag.style.background = hexA(r.color,0.1);
    tag.style.color = r.color;
    tag.style.fontSize = scale + "rem";
    tag.style.boxShadow = `0 0 14px ${hexA(r.color,0.2)}`;
    tag.innerHTML = `
      <span class="dot" style="background:${r.color}"></span>
      ${r.label}
      <span class="count" style="background:${hexA(r.color,0.2)};color:${r.color}">${r.count}</span>
    `;
    cloud.appendChild(tag);
  });

  function animate(){
    rowsHost.querySelectorAll(".region-fill").forEach(f=>{
      f.style.width = f.getAttribute("data-pct") + "%";
    });
  }
  document.addEventListener("DOMContentLoaded", ()=>setTimeout(animate, 60));
  window.__statsOpenHooks = window.__statsOpenHooks || [];
  window.__statsOpenHooks.push(animate);
})();

/* ============================================================
   Dialog 交互：点按钮/遮罩/X/Escape 开关
   ============================================================ */
(function(){
  const btn = document.getElementById("statsBtn");
  const overlay = document.getElementById("overlay");
  const panel = document.querySelector(".panel");
  const closeX = document.getElementById("closeX");

  function openIt(){
    document.body.classList.add("stats-open");
    (window.__statsOpenHooks||[]).forEach(fn=>{ try { fn(); } catch(e){} });
  }
  function closeIt(){
    document.body.classList.remove("stats-open");
  }

  btn.addEventListener("click", openIt);
  overlay.addEventListener("click", closeIt);
  closeX.addEventListener("click", closeIt);
  panel.addEventListener("click", e=>e.stopPropagation());
  document.addEventListener("keydown", e=>{
    if (e.key === "Escape" && document.body.classList.contains("stats-open")) closeIt();
  });
})();
</script>
